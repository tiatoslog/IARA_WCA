Port 8888
Listen 0.0.0.0
Timeout 600
Allow 0.0.0.0/0
# ALLOWLIST: nega tudo, libera só o que o filtro casar.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterURLs Off
# CONNECT só para 443 — sem isto o proxy vira tunel para porta arbitraria.
ConnectPort 443
LogLevel Info
