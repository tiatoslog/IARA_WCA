# Shell desktop da IARA — Tauri 2.
#
# O Rust aqui cuida SÓ de janela: bolha flutuante, atalho global, bandeja.
# As ações no computador (pasta, aplicativo, energia) moram no motor Node
# (`servidor/nucleo/AgenteLocal.ts`) — o webview conversa com ele em
# localhost:3000, mesma origem, mesmo contrato do navegador.

[package]
name = "iara-desktop"
version = "0.1.0"
description = "IARA — assistente operacional da Atos Log"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
